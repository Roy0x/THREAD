<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THREAD</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="header">
    <div class="brand"><span class="mark">◈</span> thread<span class="dot">.</span></div>
    <div class="subtitle">Your work, where you left it.</div>
  </header>
  <main>
    <section class="new-task">
      <label for="taskName">START A WORKSPACE</label>
      <input id="taskName" maxlength="80" placeholder="e.g. Fix authentication bug" autocomplete="off" />
      <button id="create">+ Save current window as task</button>
      <p class="hint">Captures the titles and URLs of normal web tabs in this window.</p>
    </section>
    <div class="section-head"><h2>Workspaces</h2><span id="count">0 saved</span></div>
    <div id="tasks" class="tasks"></div>
    <div id="empty" class="empty">No workspaces yet.<br />Start one above to keep your place.</div>
  </main>
  <footer><span class="lock">●</span> Stored only in this browser profile <span id="status" role="status"></span></footer>
  <script type="module" src="panel.js"></script>
</body>
</html>
